spring:
  application:
    name: training-analysis
  datasource:
    url: jdbc:h2:mem:trainingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080

# JWT (change in production)
app:
  jwt:
    secret: your-256-bit-secret-key-change-in-production-use-at-least-32-chars
    expiration-ms: 86400000  # 24 hours

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
